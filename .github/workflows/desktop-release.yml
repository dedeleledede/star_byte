name: desktop-release

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      STARBYTE_DOMAIN: ${{ vars.STARBYTE_DOMAIN }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npm run build
      - run: npm run tauri:build --workspace @starbyte/web -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: starbyte-client-${{ runner.os }}
          path: |
            apps/web/src-tauri/target/release/bundle/**

  arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      STARBYTE_DOMAIN: ${{ vars.STARBYTE_DOMAIN }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
      NO_STRIP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git nodejs npm rust webkit2gtk-4.1 gtk3 libayatana-appindicator openssl libsoup3 hicolor-icon-theme libarchive

      - name: Build Arch-native client package
        run: |
          npm ci
          npm run build
          npm run tauri:build --workspace @starbyte/web -- --no-bundle
          STARBYTE_VERSION="$(node -p "require('./package.json').version")" node deploy/arch/package-arch.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: starbyte-client-Arch
          path: artifacts/arch/*.pkg.tar.zst
