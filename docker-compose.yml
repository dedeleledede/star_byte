services:
  # ── Backend (Fastify + SQLite) ──────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: starbyte-server
    restart: unless-stopped
    env_file:
      - .env                     # copy .env.example → .env and fill the values
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DB_PATH: /data/starbyte.db
      STARBYTE_RELEASES_DIR: /data/releases
      # CLIENT_ORIGIN and JWT_SECRET must be set in .env
    volumes:
      - starbyte_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  # ── Frontend (React + nginx) ────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: starbyte-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - internal

volumes:
  starbyte_data:

networks:
  internal:
    driver: bridge
